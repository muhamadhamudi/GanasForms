<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}GANAS Forms{% endblock %}</title>
  <meta name="description" content="Platform formulir dan pendataan digital GANAS Universitas Nusa Putra.">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="shortcut icon" href="{{ url_for('static', filename='images/logo.png') }}">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config={theme:{extend:{colors:{navy:'#0B1F5E',blue:'#123B9A',red:'#D71920',ink:'#111827',soft:'#F5F7FB'}}}}
  </script>
  <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  {% block head %}{% endblock %}
</head>
<body class="bg-soft text-ink font-[Inter] antialiased">
{% with messages=get_flashed_messages(with_categories=true) %}
{% if messages %}<div class="fixed top-4 right-4 z-[100] space-y-2 w-[min(92vw,380px)]">{% for category,msg in messages %}
<div class="toast rounded-2xl border bg-white px-4 py-3 shadow-xl {{ 'border-red-200 text-red-700' if category=='error' else 'border-blue-100 text-navy' }}">{{ msg }}</div>
{% endfor %}</div>{% endif %}{% endwith %}
{% block body %}{% endblock %}
<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script><script>AOS.init({duration:650,once:true,offset:40});</script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
{% block scripts %}{% endblock %}
</body></html>
